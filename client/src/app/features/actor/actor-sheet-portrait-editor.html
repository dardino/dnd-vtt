<section class="surface portrait-editor">
  <h2>Ritratto</h2>
  <div
    class="portrait-editor__frame"
    (pointerdown)="startDrag($event)"
    (pointermove)="move($event)"
    (pointerup)="finishDrag()"
    (pointercancel)="finishDrag()"
  >
    @if (url(); as imageUrl) {
      <img
        [src]="imageUrl"
        alt=""
        draggable="false"
        [style.object-position]="(focusX() * 100) + '% ' + (focusY() * 100) + '%'"
        [style.transform]="'scale(' + zoom() + ')'"
      />
      <span
        class="portrait-editor__crop"
        aria-hidden="true"
        [style.left.%]="focusX() * 100"
        [style.top.%]="focusY() * 100"
      ></span>
    } @else {
      <span class="muted">Nessun ritratto</span>
    }
  </div>
  <p class="muted">Trascina il cerchio per scegliere il ritaglio del thumbnail.</p>
  <input #portraitInput class="file-input" type="file" accept="image/*" (change)="selectFile($event)" />
  <div class="inline-controls">
    <button type="button" class="btn" [disabled]="busy()" (click)="portraitInput.click()">
      {{ busy() ? 'Caricamento…' : 'Carica ritratto' }}
    </button>
    @if (url() !== null) {
      <label class="field field--inline">
        <span>Zoom</span>
        <input
          type="range"
          min="1"
          max="3"
          step="0.05"
          [value]="zoom()"
          (input)="setZoom($event)"
          (change)="commitZoom()"
        />
      </label>
    }
  </div>
</section>
