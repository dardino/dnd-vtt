@if (url() !== null || error() !== null || !editing()) {
  <section class="surface player-link">
    <h2>Scheda giocatore</h2>
    @if (url(); as link) {
      <input type="text" readonly [value]="link" aria-label="URL scheda giocatore" />
    }
    <div class="inline-controls">
      <button type="button" class="btn" [disabled]="busy()" (click)="requestToggleEditing()">
        {{ editing() ? 'Spegni matita' : 'Accendi matita' }}
      </button>
      @if (url(); as link) {
        <a class="btn" [href]="link" target="_blank" rel="noopener">Apri scheda</a>
        <button type="button" class="btn" (click)="requestCopy()">Copia link</button>
      }
      <span class="muted">{{ editing() ? 'Il giocatore può modificare la scheda' : 'Sola lettura' }}</span>
    </div>
    @if (error(); as error) {
      <p class="state--error" role="alert">{{ error }}</p>
    }
  </section>
}
