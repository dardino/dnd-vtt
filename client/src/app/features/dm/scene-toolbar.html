<nav class="scene-toolbar" aria-label="Strumenti scena">
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'select'"
    aria-label="Seleziona"
    title="Seleziona"
    (click)="setTool('select')"
  ><span class="material-symbols-outlined" aria-hidden="true">arrow_selector_tool</span></button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'measure'"
    aria-label="Misura distanza"
    title="Misura distanza"
    (click)="setTool('measure')"
  ><span class="material-symbols-outlined" aria-hidden="true">straighten</span></button>
  <button type="button" class="tool" aria-label="Tira dadi" title="Tira dadi" (click)="openDice.emit()"><span class="material-symbols-outlined" aria-hidden="true">casino</span></button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.gridVisible()"
    aria-label="Mostra griglia"
    title="Mostra griglia"
    (click)="toggleGrid()"
  ><span class="material-symbols-outlined" aria-hidden="true">grid_on</span></button>
  <span class="tool-divider"></span>
  <button
    type="button"
    class="tool"
    aria-label="Zoom avanti"
    title="Zoom avanti"
    (click)="zoomIn.emit()"
  ><span class="material-symbols-outlined" aria-hidden="true">zoom_in</span></button>
  <button
    type="button"
    class="tool"
    aria-label="Zoom indietro"
    title="Zoom indietro"
    (click)="zoomOut.emit()"
  ><span class="material-symbols-outlined" aria-hidden="true">zoom_out</span></button>
  <button
    type="button"
    class="tool"
    aria-label="Adatta mappa"
    title="Adatta mappa"
    (click)="fitMap.emit()"
  ><span class="material-symbols-outlined" aria-hidden="true">fit_screen</span></button>
  <span class="tool-divider"></span>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-reveal'"
    aria-label="Fog: rivela"
    title="Fog: rivela"
    (click)="setTool('fog-reveal')"
  ><span class="material-symbols-outlined" aria-hidden="true">visibility</span></button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-hide'"
    aria-label="Fog: nascondi"
    title="Fog: nascondi"
    (click)="setTool('fog-hide')"
  ><span class="material-symbols-outlined" aria-hidden="true">visibility_off</span></button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-rect'"
    aria-label="Fog: rettangolo"
    title="Fog: rettangolo"
    (click)="setTool('fog-rect')"
  ><span class="material-symbols-outlined" aria-hidden="true">rectangle</span></button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-lasso'"
    aria-label="Fog: lasso"
    title="Fog: lasso (doppio click per chiudere)"
    (click)="setTool('fog-lasso')"
  ><span class="material-symbols-outlined" aria-hidden="true">lasso_select</span></button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'draw'"
    aria-label="Disegno"
    title="Disegno"
    (click)="setTool('draw')"
  ><span class="material-symbols-outlined" aria-hidden="true">draw</span></button>
  <button
    type="button"
    class="tool"
    aria-label="Esporta PNG"
    title="Esporta PNG"
    (click)="exportPng.emit()"
  ><span class="material-symbols-outlined" aria-hidden="true">download</span></button>
  <button
    type="button"
    class="tool"
    aria-label="Annulla"
    title="Annulla (Ctrl+Z)"
    [disabled]="!canUndo()"
    (click)="undo.emit()"
  ><span class="material-symbols-outlined" aria-hidden="true">undo</span></button>
  <button
    type="button"
    class="tool"
    aria-label="Ripeti"
    title="Ripeti (Ctrl+Shift+Z)"
    [disabled]="!canRedo()"
    (click)="redo.emit()"
  ><span class="material-symbols-outlined" aria-hidden="true">redo</span></button>
  <span class="tool-divider"></span>
  <button
    type="button"
    class="tool"
    aria-label="Impostazioni mappa"
    title="Impostazioni mappa"
    (click)="settings.emit()"
  ><span class="material-symbols-outlined" aria-hidden="true">settings</span></button>
</nav>
