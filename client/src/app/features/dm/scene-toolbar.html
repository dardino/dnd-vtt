<nav class="scene-toolbar" aria-label="Strumenti scena">
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'select'"
    aria-label="Seleziona"
    title="Seleziona"
    (click)="setTool('select')"
  >↖</button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'measure'"
    aria-label="Misura distanza"
    title="Misura distanza"
    (click)="setTool('measure')"
  >⌁</button>
  <button type="button" class="tool" aria-label="Tira dadi" title="Tira dadi" (click)="openDice.emit()">🎲</button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.gridVisible()"
    aria-label="Mostra griglia"
    title="Mostra griglia"
    (click)="toggleGrid()"
  >#</button>
  <span class="tool-divider"></span>
  <button type="button" class="tool" aria-label="Zoom avanti" title="Zoom avanti" (click)="zoomIn.emit()">+</button>
  <button type="button" class="tool" aria-label="Zoom indietro" title="Zoom indietro" (click)="zoomOut.emit()">−</button>
  <button type="button" class="tool" aria-label="Adatta mappa" title="Adatta mappa" (click)="fitMap.emit()">⤢</button>
  <span class="tool-divider"></span>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-reveal'"
    aria-label="Fog: rivela"
    title="Fog: rivela"
    (click)="setTool('fog-reveal')"
  >◐</button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-hide'"
    aria-label="Fog: nascondi"
    title="Fog: nascondi"
    (click)="setTool('fog-hide')"
  >◑</button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-rect'"
    aria-label="Fog: rettangolo"
    title="Fog: rettangolo"
    (click)="setTool('fog-rect')"
  >▭</button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'fog-lasso'"
    aria-label="Fog: lasso"
    title="Fog: lasso (doppio click per chiudere)"
    (click)="setTool('fog-lasso')"
  >⬠</button>
  <button
    type="button"
    class="tool"
    [class.is-active]="sceneTools.tool() === 'draw'"
    aria-label="Disegno"
    title="Disegno"
    (click)="setTool('draw')"
  >✎</button>
  <button type="button" class="tool" aria-label="Esporta PNG" title="Esporta PNG" (click)="exportPng.emit()">⭳</button>
  <button
    type="button"
    class="tool"
    aria-label="Annulla"
    title="Annulla (Ctrl+Z)"
    [disabled]="!canUndo()"
    (click)="undo.emit()"
  >↶</button>
  <button
    type="button"
    class="tool"
    aria-label="Ripeti"
    title="Ripeti (Ctrl+Shift+Z)"
    [disabled]="!canRedo()"
    (click)="redo.emit()"
  >↷</button>
  <span class="tool-divider"></span>
  <button type="button" class="tool" aria-label="Impostazioni mappa" title="Impostazioni mappa" (click)="settings.emit()">⚙</button>
</nav>
