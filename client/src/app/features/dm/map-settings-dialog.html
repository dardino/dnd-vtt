<app-dialog
  [open]="open()"
  title="Impostazioni mappa"
  (closed)="requestClose()"
>
  <div class="form">
    <label class="field">
      <span>Unità di misura</span>
      <select [value]="unit()" (change)="requestUnitChange($event)">
        <option value="imperial">Anglosassone (ft)</option>
        <option value="metric">Metrica (m)</option>
      </select>
      <small class="muted">
        Griglia, righello, velocità, sensi, gittate e incantesimi usano questa unità.
        I dati restano salvati in piedi.
      </small>
    </label>
    <label class="field">
      <span>Dimensione pennello (celle)</span>
      <input
        type="number"
        min="0.5"
        max="20"
        step="0.5"
        [value]="brushCells()"
        (change)="requestBrushChange($event)"
      />
      <small class="muted">Diametro {{ brushDiameterPx() }} px sulla griglia attuale.</small>
    </label>
    <label class="field">
      <span>Dimensione matita (decimi di cella)</span>
      <input
        type="number"
        min="0.5"
        max="10"
        step="0.5"
        [value]="pencilTenths()"
        (change)="requestPencilChange($event)"
      />
      <small class="muted">{{ pencilWidthPx() }} px sulla griglia attuale.</small>
    </label>
  </div>
  <div class="initiative__actions">
    <app-button variant="danger" (pressed)="requestClearHistory()">Svuota history</app-button>
    <app-button variant="danger" (pressed)="requestResetFog()">Reset FOG</app-button>
  </div>
  <p class="muted">
    Svuota history mantiene la scena com'è e la rende il nuovo punto di partenza.
    Reset FOG ricopre tutta la mappa e rimuove dalla history solo le azioni fog.
  </p>
  <div dialog-actions>
    <app-button (pressed)="requestClose()">Chiudi impostazioni</app-button>
  </div>
</app-dialog>
