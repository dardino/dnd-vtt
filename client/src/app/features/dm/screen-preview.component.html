<div
  class="screen-preview"
  [class.screen-preview--blackout]="state().program.blackout"
  [style.background]="state().program.background"
>
  <app-display-layer [layer]="base()" [initiative]="state().initiative" />
  @for (layer of overlays(); track layer.id) {
    <app-display-layer [layer]="layer" [initiative]="state().initiative" />
  }
</div>
