<div
  #host
  class="scene-canvas"
  role="img"
  tabindex="0"
  [attr.aria-label]="ariaLabel()"
  [class.scene-canvas--measure]="tool() === 'measure'"
  [class.scene-canvas--tool]="tool() !== 'select' && tool() !== 'measure'"
  [attr.data-camera-scale]="camera().scale"
  [attr.data-camera-x]="camera().x"
  [attr.data-camera-y]="camera().y"
  [attr.data-tiled]="tiled()"
  [attr.data-tiles-ready]="tilesReady()"
  [attr.data-cell-size]="state().grid.cellSizePx"
  [attr.data-grid-type]="state().grid.type"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
  (keydown)="onKeyDown($event)"
>
  <div #container class="scene-canvas__stage"></div>
  @if (statusLabel() !== '') {
    <span class="scene-canvas__measure">{{ statusLabel() }}</span>
  }
</div>
